# Which UCI network interfaces to take down in standby, and whether to do
# it at all. Set NETWORK_DOWN=0 to keep the box reachable over the network
# while the display is off.
NETWORK_DOWN=1
NETWORK_INTERFACES="wan"

# The cpufreq governor to use in standby, and the core kept online to watch
# for the remote.
GOVERNOR=powersave
KEEP_CPU=0

# Which USB device the amplifier is, for the supplied hook. Left empty it
# finds whichever device carries an audio interface, which is right for a
# box with one USB sound device. Give AMP_USB a bus path such as 3-1.2, or
# AMP_USB_ID a vendor:product pair such as 1235:8210, to name one outright.
AMP_USB=
AMP_USB_ID=
